<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b84f3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="笺页 · JianYIE —— 本地优先的 AI 角色聊天客户端" />
    <title>笺页</title>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__logo">笺</div>
        <div class="boot__name">笺页</div>
      </div>
    </div>
    <style>
      .boot {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(120% 90% at 50% 0%, #eef5ff, #f8fafc 70%);
        font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
        animation: bootIn .45s ease-out both;
      }
      .boot__logo {
        width: 74px;
        height: 74px;
        border-radius: 22px;
        background: linear-gradient(135deg, #2f86ff, #09348c);
        color: #fff;
        font-size: 40px;
        font-weight: 700;
        display: grid;
        place-items: center;
        box-shadow: 0 14px 30px rgba(11, 70, 160, 0.24);
        animation: logoIn .55s cubic-bezier(.2,.8,.2,1) both;
      }
      .boot__name {
        color: #4b627d;
        font-size: 13px;
        letter-spacing: 5px;
        animation: nameIn .6s .08s both;
      }
      @keyframes bootIn { from { opacity: 0 } to { opacity: 1 } }
      @keyframes logoIn { from { opacity: 0; transform: translateY(8px) scale(.92) } to { opacity: 1; transform: none } }
      @keyframes nameIn { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
