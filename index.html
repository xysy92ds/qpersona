<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b84f3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Q 伴 / QPersona —— 看起来是 QQ，好友全都是 AI 角色的本地优先聊天应用" />
    <title>Q伴</title>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__logo">Q</div>
        <div class="boot__name">Q伴</div>
      </div>
    </div>
    <style>
      .boot {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(180deg, #e9f0ff, #f6f8fb);
        font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
      }
      .boot__logo {
        width: 74px;
        height: 74px;
        border-radius: 22px;
        background: linear-gradient(135deg, #2ac8ff, #0b6fe0);
        color: #fff;
        font-size: 42px;
        font-weight: 700;
        display: grid;
        place-items: center;
        box-shadow: 0 14px 30px rgba(11, 111, 224, 0.28);
      }
      .boot__name {
        color: #5c6472;
        font-size: 13px;
        letter-spacing: 4px;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
